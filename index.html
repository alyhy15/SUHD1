<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آخر إشارة | Last Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0e12; --ink2:#11161c; --glass:rgba(13,17,22,.78); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#eef1f3; --muted:#a3adb6; --dim:#6d7883;
  --copper:#d9773e; --copper2:#f0a06a; --sky:#6fd6d0; --sky2:#a9ece7; --amber:#f2b85b; --ok:#7fd99a; --bad:#f08776;
  --r:14px; --sans:'IBM Plex Sans Arabic',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --panelW:420px; --ease:cubic-bezier(.22,.8,.24,1);
  --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--sky)}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,.45) 100%);pointer-events:none}

/* ---------- top bar ---------- */
#top{position:fixed;top:0;inset-inline:0;display:flex;align-items:center;gap:14px;padding:calc(12px + var(--safeT)) 18px 12px;z-index:20;pointer-events:none;transition:opacity .6s var(--ease)}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--sky);box-shadow:0 0 12px var(--sky)}
#prog{flex:1;display:flex;gap:6px;max-width:420px;margin-inline:auto}
#prog .seg{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;position:relative}
#prog .seg b{position:absolute;inset:0;background:linear-gradient(90deg,var(--copper),var(--amber));transform:scaleX(0);transform-origin:inline-start;transition:transform .9s var(--ease)}
html[dir=rtl] #prog .seg b{transform-origin:right}
html[dir=ltr] #prog .seg b{transform-origin:left}
#prog .lbl{display:none}
.tbtn{height:34px;padding:0 12px;border-radius:999px;background:rgba(13,17,22,.6);border:1px solid var(--line2);font-size:13px;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(8px)}
.tbtn:hover{border-color:rgba(255,255,255,.3)}
#evChip b{font-family:var(--mono);color:var(--amber);min-width:12px;text-align:center}
#evChip.bump{animation:bump .6s var(--ease)}
@keyframes bump{40%{transform:scale(1.18);border-color:var(--amber)}}

/* ---------- panel ---------- */
#panel{position:fixed;top:72px;bottom:18px;inset-inline-start:18px;width:var(--panelW);z-index:15;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35);transition:transform .7s var(--ease),opacity .6s var(--ease)}
#panel.hide{opacity:0;transform:translateY(16px);pointer-events:none}
#pbody{flex:1;overflow-y:auto;padding:24px 24px 16px;scrollbar-width:thin}
#pfoot{padding:14px 24px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
#pfoot:empty{display:none}
.enter{animation:enter .7s var(--ease) both}
.enter>*{animation:enter .7s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}.enter>*:nth-child(6){animation-delay:.3s}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.leave{opacity:0;transform:translateY(-6px);transition:all .22s ease}
.kicker{font-size:13px;color:var(--copper2);font-weight:500;margin-bottom:2px}
h2{font-size:24px;line-height:1.35;margin:0 0 10px;font-weight:700}
.q{font-size:18px;line-height:1.6;font-weight:600;margin:4px 0 12px;color:#fff}
.lead{color:var(--muted);margin:0 0 14px}
.task{display:flex;gap:10px;align-items:flex-start;background:rgba(111,214,208,.08);border:1px solid rgba(111,214,208,.25);color:var(--sky2);padding:10px 14px;border-radius:12px;margin:0 0 14px;font-size:15px}
.task:before{content:"";flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--sky);box-shadow:0 0 10px var(--sky);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.btn{min-height:46px;padding:0 20px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-weight:500;transition:transform .15s,background .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:rgba(255,255,255,.32)}
.btn.main{background:var(--copper);border-color:var(--copper);color:#1c0c03;font-weight:600;flex:1}
.btn.main:hover{background:var(--copper2)}
.opts{display:grid;gap:9px}
.opt{text-align:start;padding:12px 15px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);line-height:1.55;transition:all .2s}
.opt:hover:not([disabled]){border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
.opt.on{border-color:var(--sky);background:rgba(111,214,208,.1)}
.opt.right{border-color:var(--ok);background:rgba(127,217,154,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(240,135,118,.1)}
.opt[disabled]{cursor:default}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:15px;line-height:1.6}
.fb.ok{background:rgba(127,217,154,.1);border:1px solid rgba(127,217,154,.35)}
.fb.no{background:rgba(240,135,118,.08);border:1px solid rgba(240,135,118,.35)}
.fb.info{background:rgba(255,255,255,.05);border:1px solid var(--line2);color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid currentColor;font-weight:500}
.tag.sim{color:var(--amber)}.tag.real{color:var(--sky)}
.thumb{display:flex;gap:12px;align-items:center;margin-top:12px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:start;width:100%}
.thumb img{width:74px;height:58px;object-fit:cover;border-radius:8px;flex:none}
.thumb span{font-size:13px;color:var(--muted);line-height:1.5}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:0}

/* power gauge */
.gauge{margin:6px 0 16px;padding:14px 16px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.gauge .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.gauge .val{font-family:var(--mono);font-size:26px;color:#fff}
.gauge .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.gauge .fill{height:100%;width:100%;border-radius:6px;background:var(--ok);transition:width 1.2s var(--ease),background .6s}
.gauge .msg{font-size:14px;margin-top:8px;min-height:24px;color:var(--text)}
.scs{display:grid;gap:8px;margin-bottom:12px}
.sc{display:flex;align-items:center;gap:10px;text-align:start;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);transition:all .2s}
.sc i{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px}
.sc.done i{background:var(--sky);border-color:var(--sky);color:#06201c}
.sc.on{border-color:var(--sky)}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match h4{margin:0 0 6px;font-size:13px;color:var(--dim);font-weight:500}
.mcol{display:grid;gap:8px;align-content:start}
.mi{text-align:start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);font-size:14px;line-height:1.5;transition:all .2s;position:relative}
.mi.sel{border-color:var(--sky);background:rgba(111,214,208,.1)}
.mi.done{border-color:var(--ok);background:rgba(127,217,154,.1);cursor:default}
.mi .n{position:absolute;top:-8px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#0b2414;font-size:11px;font-weight:700;display:grid;place-items:center}

/* steps tracker */
.steps{display:flex;gap:6px;margin:0 0 14px}
.steps span{flex:1;text-align:center;font-size:12px;padding:5px 0;border-radius:8px;background:rgba(255,255,255,.04);color:var(--dim);border:1px solid var(--line)}
.steps span.on{color:#fff;border-color:var(--copper);background:rgba(217,119,62,.14)}
.steps span.done{color:var(--sky2);border-color:rgba(111,214,208,.3)}

/* measure */
.meas{display:grid;gap:10px;margin-bottom:12px}
.mbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line2);text-align:start}
.mbtn .ring{--p:0;flex:none;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--sky) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center}
.mbtn .ring:after{content:"";width:34px;height:34px;border-radius:50%;background:var(--ink2)}
.mbtn small{display:block;color:var(--muted);font-size:12px}
.mbtn.done{border-color:var(--sky)}

/* chain */
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.chain span{font-size:13px;padding:6px 10px;border-radius:10px;border:1px solid var(--line2);opacity:.35;transition:all .5s}
.chain span.lit{opacity:1;border-color:var(--sky);background:rgba(111,214,208,.12);color:var(--sky2)}
.chain i{font-style:normal;color:var(--dim)}
.result{padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(111,214,208,.14),rgba(217,119,62,.1));border:1px solid rgba(111,214,208,.3);font-weight:500;line-height:1.7}

/* order */
.timeline{display:grid;gap:8px;margin-bottom:14px;min-height:10px}
.tl{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(111,214,208,.08);border:1px solid rgba(111,214,208,.25);animation:enter .5s var(--ease)}
.tl b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sky);color:#06201c;display:grid;place-items:center;font-size:13px}
.tl small{display:block;color:var(--muted);font-size:12px}
.ocards{display:grid;gap:8px}
.oc{text-align:start;padding:11px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px dashed var(--line2);transition:all .2s}
.oc:hover{border-color:rgba(255,255,255,.35)}

/* quote / outro */
.quote{font-size:20px;line-height:1.7;font-weight:600;margin:6px 0 18px;padding-inline-start:16px;border-inline-start:3px solid var(--copper)}
.fact{padding:14px 16px;border-radius:14px;background:rgba(242,184,91,.08);border:1px solid rgba(242,184,91,.3);margin-bottom:14px}
.fact b{display:block;color:var(--amber);font-size:13px;margin-bottom:4px}

/* finale */
.sent{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);margin-bottom:12px}
.sent .st{font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:14px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line2);transition:all .2s}
.chip.on{border-color:var(--sky);color:var(--sky2);background:rgba(111,214,208,.1)}
.chip.ev.on{border-color:var(--amber);color:var(--amber);background:rgba(242,184,91,.1)}
.sent input,.inp{width:100%;margin-top:8px;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:9px 12px}
.sent .lk{font-size:12px;color:var(--dim);margin:10px 0 6px}

/* ---------- media stage ---------- */
#media{position:fixed;top:72px;bottom:86px;inset-inline-end:18px;inset-inline-start:calc(var(--panelW) + 36px);z-index:12;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .7s var(--ease)}
#media.on{opacity:1;pointer-events:auto}
#media .frame{position:relative;max-width:100%;max-height:100%;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid var(--line2);animation:pop .8s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
#media img.main{display:block;max-width:min(78vw,100%);max-height:calc(100dvh - 160px);object-fit:contain;user-select:none;-webkit-user-drag:none}
#media .cap{position:absolute;inset-inline:0;bottom:0;padding:22px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:12.5px;color:#dfe5ea;line-height:1.5}
#media .cap small{display:block;font-family:var(--mono);font-size:10.5px;color:#9aa6b0}
#media .badge{position:absolute;top:10px;inset-inline-start:10px}
.reticle:before,.reticle:after{content:"";position:absolute;inset:12px;border:2px solid rgba(111,214,208,.6);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) top left/22px 22px no-repeat,linear-gradient(#000 0 0) top right/22px 22px no-repeat,linear-gradient(#000 0 0) bottom left/22px 22px no-repeat,linear-gradient(#000 0 0) bottom right/22px 22px no-repeat;
  mask:linear-gradient(#000 0 0) top left/22px 22px no-repeat,linear-gradient(#000 0 0) top right/22px 22px no-repeat,linear-gradient(#000 0 0) bottom left/22px 22px no-repeat,linear-gradient(#000 0 0) bottom right/22px 22px no-repeat}
.reticle:after{inset:auto;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;-webkit-mask:none;mask:none;border-color:rgba(111,214,208,.35)}
.mark{position:absolute;transform:translate(-50%,-50%);border:2.5px solid var(--sky);border-radius:50%;box-shadow:0 0 0 3px rgba(111,214,208,.25),0 0 18px rgba(111,214,208,.6);pointer-events:none;animation:mark .5s var(--ease)}
.mark.amber{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,184,91,.25),0 0 18px rgba(242,184,91,.6)}
@keyframes mark{from{transform:translate(-50%,-50%) scale(1.6);opacity:0}}
.miss{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;pointer-events:none;animation:missf 1s forwards}
.miss:before,.miss:after{content:"";position:absolute;left:50%;top:0;width:2.5px;height:22px;background:var(--bad);border-radius:2px}
.miss:before{transform:rotate(45deg)}.miss:after{transform:rotate(-45deg)}
@keyframes missf{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
.scan{position:absolute;inset-inline:0;height:2px;background:var(--sky);box-shadow:0 0 14px var(--sky);top:0;animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%{top:6%}50%{top:92%}100%{top:6%}}
.ph{width:min(560px,70vw);aspect-ratio:4/3;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:repeating-linear-gradient(45deg,#14191f 0 12px,#171d24 12px 24px)}

/* legacy card */
.legacy{position:relative;width:min(640px,86vw);max-height:100%;overflow:auto;border-radius:20px;overflow:hidden;background:#20120b;border:1px solid rgba(242,184,91,.35);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .9s var(--ease)}
.legacy .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42}
.legacy .in{position:relative;padding:26px 28px;background:linear-gradient(180deg,rgba(10,8,6,.15),rgba(10,8,6,.82) 55%)}
.legacy .lt{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:.06em}
html[dir=rtl] .legacy .lt{font-family:var(--sans);letter-spacing:0}
.legacy h3{font-size:24px;margin:4px 0 14px}
.legacy p{margin:0 0 10px;font-size:16.5px;line-height:1.7}
.legacy p em{font-style:normal;display:inline-block;font-size:11.5px;color:var(--amber);border:1px solid rgba(242,184,91,.45);border-radius:999px;padding:0 8px;margin-inline-start:6px;vertical-align:2px}
.legacy .meta{font-family:var(--mono);font-size:10.5px;color:#cdb9aa;margin-top:14px}
.legacy .by{color:#e8d6c8;font-size:14px}

/* ---------- hotspots ---------- */
#hots{position:fixed;inset:0;pointer-events:none;z-index:14}
.hot{position:absolute;left:0;top:0;pointer-events:auto;display:none;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%}
.hot .c{position:absolute;inset:18px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 4px rgba(111,214,208,.35),0 0 24px var(--sky)}
.hot .w{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sky);animation:wave 1.8s infinite var(--ease)}
.hot .w:nth-child(2){animation-delay:.9s}
@keyframes wave{from{transform:scale(.35);opacity:1}to{transform:scale(1.15);opacity:0}}
.hot .l{position:absolute;top:66px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;padding:3px 10px;border-radius:999px;background:rgba(11,14,18,.82);border:1px solid rgba(111,214,208,.4);color:var(--sky2)}

/* ---------- opening ---------- */
#opening{position:fixed;inset:0;z-index:30;pointer-events:none}
#opening.active{pointer-events:auto}
#ohud{position:absolute;top:calc(22px + var(--safeT));inset-inline-start:24px;font-family:var(--mono);font-size:12px;color:#f3dfcf;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:opacity .8s;direction:ltr;text-align:left}
html[dir=rtl] #ohud{text-align:right}
#ohud .pw{margin-top:10px;width:200px}
#ohud .pb{height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:4px}
#ohud .pb b{display:block;height:100%;width:100%;background:var(--ok);transition:width .3s linear,background .5s}
#ohud .st{margin-top:8px;min-height:18px}
#ohud .warn{color:var(--amber);animation:blink 0.8s infinite}
#oblack{position:absolute;inset:0;background:#050607;opacity:0;transition:opacity 1.4s ease}
#ocenter{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#oimg{position:relative;width:min(340px,62vw,42vh);aspect-ratio:1;border-radius:6px;overflow:hidden;opacity:0;transition:opacity .8s;border:1px solid rgba(255,255,255,.12);background:#000}
#oimg img{width:100%;height:100%;display:block}
#oimg .cover{position:absolute;inset-inline:0;bottom:0;top:0;background:#000}
#oimg .line{position:absolute;inset-inline:0;height:2px;background:#cfe;box-shadow:0 0 12px #9ff;top:0;opacity:0}
#oimg .meta{position:absolute;top:6px;left:8px;font-family:var(--mono);font-size:10px;color:#9fb;opacity:.8;direction:ltr}
#olost{font-family:var(--mono);font-size:clamp(26px,5vw,44px);letter-spacing:.18em;color:#fff;opacity:0;transition:opacity .4s;direction:ltr}
#olost.on{opacity:1;animation:glitch 1.2s steps(2) 1}
@keyframes glitch{0%{text-shadow:3px 0 var(--bad),-3px 0 var(--sky);transform:translateX(2px)}25%{text-shadow:-4px 0 var(--bad),4px 0 var(--sky);transform:translateX(-3px)}50%{text-shadow:2px 0 var(--bad),-2px 0 var(--sky)}100%{text-shadow:none;transform:none}}
#olostAr{font-size:clamp(18px,3vw,24px);color:var(--copper2);opacity:0;transition:opacity 1s;margin-top:-6px}
#oq{font-size:clamp(18px,2.6vw,24px);font-weight:600;opacity:0;transition:opacity 1.2s;max-width:640px}
#obtn{opacity:0;transform:translateY(8px);transition:all .9s var(--ease);min-height:52px;padding:0 28px;font-size:17px}
#obtn.on{opacity:1;transform:none}
#onote{font-size:12.5px;color:#8f9aa4;max-width:520px;opacity:0;transition:opacity 1.2s;line-height:1.6}
#oskip{position:absolute;z-index:6;bottom:calc(18px + var(--safeB));inset-inline-end:20px;font-size:13px;color:#aab4bd;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3)}
#ostart{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#050607;transition:opacity 1s;text-align:center;padding:24px}

/* finale: linked discovery chain */
.chainv{display:grid;gap:0;margin:6px 0 4px}
.chainv .link{width:2px;height:12px;background:var(--line2);margin-inline-start:22px}
.slot{--tc:var(--copper2);padding:9px 12px;border-radius:12px;border:1px dashed var(--line2);background:rgba(255,255,255,.02);transition:all .3s var(--ease)}
.slot.t-ev{--tc:var(--sky)}.slot.t-res{--tc:var(--ok)}
.slot .ty{display:inline-block;font-size:11.5px;font-weight:600;color:var(--tc);border:1px solid var(--tc);border-radius:999px;padding:0 8px;margin-bottom:4px}
.slot .st{font-size:14.5px;line-height:1.6;color:var(--muted)}
.slot .st span{color:#fff;font-weight:500}
.slot .st em{font-style:normal;color:var(--tc);opacity:.6;letter-spacing:.1em}
.slot.cur{border-style:solid;border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 18%,transparent);background:color-mix(in srgb,var(--tc) 7%,transparent)}
.slot.full{border-style:solid;border-color:color-mix(in srgb,var(--tc) 55%,transparent)}
.slot .edb{width:24px;height:24px;padding:0;justify-content:center;font-size:11px;margin-inline-start:6px;vertical-align:middle}
.evgrid.one{grid-template-columns:1fr}
.evb.t-tool{border-color:rgba(240,160,106,.45);background:linear-gradient(135deg,rgba(240,160,106,.1),rgba(255,255,255,.02))}
.evb.t-tool b{color:var(--copper2)}
.evb.t-ev{border-color:rgba(111,214,208,.45);background:linear-gradient(135deg,rgba(111,214,208,.09),rgba(255,255,255,.02))}
.evb.t-ev b{color:var(--sky2)}
.evb.t-res{border-color:rgba(127,217,154,.45);background:linear-gradient(135deg,rgba(127,217,154,.09),rgba(255,255,255,.02))}
.evb.t-res b{color:var(--ok)}
@media (max-width:860px){.evgrid.one .evb small{display:block}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
